name: IRVE FR Sync

# Vorerst NUR manuell auslösbar (Actions-Tab → Run workflow). Der Voll-Sync
# lädt ~150k Zeilen nach Neon und wird erst nach Entscheid über Datenvolumen /
# Neon-Tarif aktiviert. Danach den schedule-Block einkommentieren.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 4 5 * *" # monatlich (IRVE-Konsolidat aktualisiert laufend)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run IRVE FR sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync:irve-fr
