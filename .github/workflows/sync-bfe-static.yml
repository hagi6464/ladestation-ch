name: BFE Static Sync

on:
  schedule:
    # Täglich 04:00 UTC (06:00 CH-Sommerzeit, 05:00 Winterzeit)
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync:static
